name: Catalog integrity

on:
  push:
    branches: [main, "ci/catalog-integrity-checks"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-catalog:
    name: Validate catalogue links (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate README link targets
        run: python scripts/check_catalog.py --readme README.md --root .
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile validator and tests
        run: python -m compileall -q scripts tests
